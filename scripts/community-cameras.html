<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Câmeras sintéticas — teste local</title><style>body{font:18px system-ui;background:#292236;color:white;padding:30px}button{padding:15px}section{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}canvas{width:100%}</style><h1>Teste local de vídeo</h1><p>Publica apenas desenhos animados gerados por código. Nenhuma câmera ou microfone é acessado.</p><button id="start">Iniciar seis câmeras sintéticas</button><button id="stop">Parar tudo</button><p id="status">Aguardando.</p><section id="tiles"></section><script type="module">
import {Room,LocalVideoTrack,Track} from 'livekit-client';
const rooms=[],timers=[];
document.querySelector('#start').onclick=async()=>{document.querySelector('#start').disabled=true;try{const tokens=await(await fetch('http://127.0.0.1:54329/qa/camera-tokens')).json();for(let i=0;i<tokens.length;i++){const canvas=document.createElement('canvas');canvas.width=1280;canvas.height=720;document.querySelector('#tiles').append(canvas);const ctx=canvas.getContext('2d');function draw(){ctx.fillStyle=['#8c659e','#42827a','#d78468','#537798','#92862e','#ac6185'][i];ctx.fillRect(0,0,1280,720);ctx.fillStyle='white';ctx.font='bold 80px sans-serif';ctx.fillText(tokens[i].label,75,190);ctx.font='36px sans-serif';ctx.fillText('Vídeo sintético · '+new Date().toLocaleTimeString(),75,280);ctx.beginPath();ctx.arc(300+(Date.now()/20)%500,470,90,0,Math.PI*2);ctx.fill()}draw();timers.push(setInterval(draw,125));const track=new LocalVideoTrack(canvas.captureStream(8).getVideoTracks()[0]);const room=new Room();await room.connect('ws://127.0.0.1:7880',tokens[i].token,{autoSubscribe:false});await room.localParticipant.publishTrack(track,{source:Track.Source.Camera,simulcast:true,videoCodec:'vp8'});rooms.push(room)}document.querySelector('#status').textContent='6 câmeras sintéticas transmitindo.'}catch(e){document.querySelector('#status').textContent=e.message}};
document.querySelector('#stop').onclick=()=>{rooms.forEach(r=>r.disconnect());timers.forEach(clearInterval);document.querySelector('#status').textContent='Transmissões encerradas.'};
</script></html>
